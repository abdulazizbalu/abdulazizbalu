name: Generate Snake

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual run from Actions tab
  workflow_dispatch:
  # Run on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate the snake animation files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: abdulazizbalu
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-terminal-dark.svg?palette=github-dark&color_snake=#39ff14&color_dots=#0b1a0d,#0e4429,#006d32,#26a641,#39d353
            dist/snake-terminal-light.svg?color_snake=#16a34a&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
