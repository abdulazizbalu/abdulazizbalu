  <text x="40" y="218" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="11.5" fill="#b8f7c0">JavaScript</text>
  <text x="418" y="218" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="11.5" fill="#1d6b26">#agents  #hitl  #llmops</text>
