<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label="build smart. ship clean. operate reliably.">
  <title>footer</title>
  <defs>
    <filter id="glow-ft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2-ft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan-ft" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="vig-ft" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="screen-ft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071107"/>
      <stop offset="1" stop-color="#040904"/>
    </linearGradient>
    <linearGradient id="sweep-ft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff14" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="94" rx="10" fill="url(#screen-ft)" stroke="#1d6b26" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="30" rx="10" fill="#0a170b"/>
  <rect x="1" y="20" width="898" height="11" fill="#0a170b"/>
  <line x1="1" y1="31" x2="899" y2="31" stroke="#1d6b26" stroke-width="1"/>
  <circle cx="20" cy="16" r="5" fill="#ff4d4d" opacity="0.75"/>
  <circle cx="37" cy="16" r="5" fill="#ffb000" opacity="0.75"/>
  <circle cx="54" cy="16" r="5" fill="#22c55e" opacity="0.75"/>
  <text x="450.0" y="20.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="12" fill="#5f9e6a">session</text>
  <text x="30" y="66" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14" fill="#22c55e" textLength="554.4" lengthAdjust="spacingAndGlyphs">balu@tashkent<tspan fill="#5f9e6a">:</tspan><tspan fill="#ffb000">~</tspan><tspan fill="#5f9e6a">$</tspan><tspan fill="#b8f7c0"> echo "build smart. ship clean. operate reliably."</tspan></text>
  <rect x="592.8" y="54" width="8.4" height="15" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect>
  <rect x="1" y="32" width="898" height="63" fill="url(#scan-ft)" pointer-events="none"/>
  <rect x="1" y="1" width="898" height="94" rx="10" fill="url(#vig-ft)" pointer-events="none"/>
</svg>
