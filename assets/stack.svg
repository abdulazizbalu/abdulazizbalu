<svg xmlns="http://www.w3.org/2000/svg" width="900" height="293" viewBox="0 0 900 293" role="img" aria-label="Tech stack">
  <title>stack</title>
  <defs>
    <filter id="glow-st" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2-st" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan-st" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="vig-st" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="screen-st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071107"/>
      <stop offset="1" stop-color="#040904"/>
    </linearGradient>
    <linearGradient id="sweep-st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff14" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="291" rx="10" fill="url(#screen-st)" stroke="#1d6b26" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="30" rx="10" fill="#0a170b"/>
  <rect x="1" y="20" width="898" height="11" fill="#0a170b"/>
  <line x1="1" y1="31" x2="899" y2="31" stroke="#1d6b26" stroke-width="1"/>
  <circle cx="20" cy="16" r="5" fill="#ff4d4d" opacity="0.75"/>
  <circle cx="37" cy="16" r="5" fill="#ffb000" opacity="0.75"/>
  <circle cx="54" cy="16" r="5" fill="#22c55e" opacity="0.75"/>
  <text x="450.0" y="20.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="12" fill="#5f9e6a">~/stack</text><text x="30" y="62" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#22c55e" textLength="339.3" lengthAdjust="spacingAndGlyphs">balu@tashkent<tspan fill="#5f9e6a">:</tspan><tspan fill="#ffb000">~</tspan><tspan fill="#5f9e6a">$</tspan><tspan fill="#b8f7c0"> tree ./stack --depth 1</tspan></text><text x="30" y="92" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#1d6b26">├─ <tspan fill="#ffb000">frontend</tspan><tspan x="150" fill="#b8f7c0">Next.js 15 · React 19 · TypeScript · Tailwind · Framer Motion</tspan><animate attributeName="opacity" values="0;0" dur="0.30s"/></text><text x="30" y="119" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#1d6b26">├─ <tspan fill="#ffb000">backend</tspan><tspan x="150" fill="#b8f7c0">Node.js · Python · FastAPI · Supabase · PostgreSQL</tspan><animate attributeName="opacity" values="0;0" dur="0.48s"/></text><text x="30" y="146" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#1d6b26">├─ <tspan fill="#ffb000">ai</tspan><tspan x="150" fill="#b8f7c0">Claude · OpenAI · Ollama/Gemma · RAG · evals · agents</tspan><animate attributeName="opacity" values="0;0" dur="0.66s"/></text><text x="30" y="173" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#1d6b26">├─ <tspan fill="#ffb000">bots</tspan><tspan x="150" fill="#b8f7c0">grammY · aiogram · Telegram Mini Apps</tspan><animate attributeName="opacity" values="0;0" dur="0.84s"/></text><text x="30" y="200" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#1d6b26">├─ <tspan fill="#ffb000">desktop</tspan><tspan x="150" fill="#b8f7c0">Electron · local LLM runtimes</tspan><animate attributeName="opacity" values="0;0" dur="1.02s"/></text><text x="30" y="227" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#1d6b26">├─ <tspan fill="#ffb000">ops</tspan><tspan x="150" fill="#b8f7c0">Docker · GitHub Actions · Railway · Vercel</tspan><animate attributeName="opacity" values="0;0" dur="1.20s"/></text><text x="30" y="254" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="14.5" fill="#1d6b26">└─ <tspan fill="#ffb000">niche</tspan><tspan x="150" fill="#b8f7c0">GnuCOBOL · QuantLib · NumPy · OR-Tools · Hypothesis</tspan><animate attributeName="opacity" values="0;0" dur="1.38s"/></text><text x="30" y="287" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace" font-size="12" fill="#5f9e6a">7 directories, shipped to production<animate attributeName="opacity" values="0;0" dur="1.7s"/></text>
  <rect x="1" y="32" width="898" height="260" fill="url(#scan-st)" pointer-events="none"/>
  <rect x="1" y="1" width="898" height="291" rx="10" fill="url(#vig-st)" pointer-events="none"/>
  <rect x="1" y="-80" width="898" height="80" fill="url(#sweep-st)" pointer-events="none">
    <animate attributeName="y" values="-80;293" dur="6s" repeatCount="indefinite"/>
